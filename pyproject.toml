[project]
name = "ai-job-matcher"
version = "0.1.0"
description = "Local read-only AI job matching dashboard with scoring and history"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["job_matcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
